# =============================================================================
# 安全扫描流水线 — CodeQL / Bandit / gitleaks / pip-audit
#
# 触发条件：
#   - push 到 main          → 全量扫描
#   - 针对 main 的 PR        → 全量扫描（阻止有问题的 PR 合并）
#   - 每周一 06:00（北京时间）→ 定时全量扫描
#
# 扫描项目：
#   CodeQL     GitHub 官方 SAST，扫注入/反序列化/路径穿越等深层逻辑漏洞
#   Bandit     Python 专用安全 lint，扫 eval/exec/pickle/硬编码密钥等
#   gitleaks   密钥泄漏扫描，防止 API Key / SSH 私钥被 commit 进仓库
#   pip-audit  依赖漏洞（CVE），基于 PyPA 官方漏洞数据库
# =============================================================================

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 22 * * 0'   # 每周一 UTC 22:00 = 北京时间周一 06:00

permissions:
  actions: read
  contents: read
  security-events: write   # CodeQL 需要上传扫描结果到 Security tab

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) CodeQL — 深层代码分析
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: python
          queries: security-and-quality

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:python"

  # ---------------------------------------------------------------------------
  # 2) Bandit — Python 安全 lint
  # ---------------------------------------------------------------------------
  bandit:
    name: Bandit Scan
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装并运行 Bandit
        run: |
          pip install bandit[toml]
          # -ll 只报中高危，-f json 输出报告，-r 递归扫描
          bandit -r . -ll -f json -o bandit-report.json || true
          # 重新运行，用退出码控制 job 成败（中危以上会导致非零退出）
          bandit -r . -ll

      - name: 上传 Bandit 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3) gitleaks — 密钥泄漏扫描
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码（完整历史，用于扫描所有提交）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 4) pip-audit — 依赖漏洞扫描
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit (CVE)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装并运行 pip-audit
        run: |
          pip install pip-audit
          # --strict: 发现漏洞时返回非零退出码，阻断流水线
          pip-audit -r requirements.txt --strict
