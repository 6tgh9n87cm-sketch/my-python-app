# =============================================================================
# CI/CD Pipeline — Python 项目（自动构建 / 测试 / SSH 部署）
#
# 触发条件：
#   - 向 main / master 推送        → 执行 测试 + 构建 + 部署
#   - 针对 main / master 的 PR     → 仅执行 测试（不部署）
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   SSH_HOST      云服务器 IP 或域名
#   SSH_PORT      SSH 端口（默认 22，可不填）
#   SSH_USERNAME  登录用户名（建议专用部署账号，如 deploy）
#   SSH_KEY       部署用的私钥（对应已加入服务器 ~/.ssh/authorized_keys 的公钥）
#
# 可在下方 env 中调整：
#   DEPLOY_PATH   服务器上的项目目录
#   SERVICE_NAME  systemd 服务名（如使用 systemd 托管）
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 最小权限原则
permissions:
  contents: read

# 同一分支并发运行时取消旧任务，避免堆积
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"      # 主版本（用于覆盖率上报等单一任务）
  DEPLOY_PATH: "/var/www/app" # 服务器部署目录
  SERVICE_NAME: "myapp"       # systemd 服务名（按需修改）

jobs:
  # ---------------------------------------------------------------------------
  # 1) 代码质量 + 测试（多版本矩阵）
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff 静态检查
        run: ruff check .

      - name: 运行测试（含覆盖率）
        run: pytest --cov=. --cov-report=xml -q

      - name: 上报覆盖率（仅主版本）
        if: matrix.python-version == env.PYTHON_VERSION
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2) 打包构建（仅 push 到主分支时）
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 构建 sdist & wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3) 部署到云服务器（仅 push 到主分支时，且测试通过）
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to server (SSH)
    runs-on: ubuntu-latest
    needs: test          # 部署前置条件：测试通过（构建为独立校验，不阻塞部署）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 SSH 环境
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: 同步代码到服务器（rsync 增量）
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }} -i ~/.ssh/deploy_key -o ServerAliveInterval=15 -o ServerAliveCountMax=6" \
            ./ "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: 远程安装依赖并重启服务
        run: |
          ssh -p "${{ secrets.SSH_PORT || 22 }}" -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=6 \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" <<'REMOTE'
            set -e
            cd "${{ env.DEPLOY_PATH }}"

            # 虚拟环境（不存在则创建）
            test -d .venv || python3 -m venv .venv
            . .venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            # ===== 重启服务：按你的部署方式保留其一 =====
            # 方式 A：systemd 托管（部署账号需配置 NOPASSWD sudo 执行 systemctl）
            sudo systemctl restart "${{ env.SERVICE_NAME }}"

            # 方式 B：Docker Compose
            # docker compose -f docker-compose.yml up -d --build

            # 方式 C：Supervisor
            # supervisorctl restart "${{ env.SERVICE_NAME }}"
          REMOTE
