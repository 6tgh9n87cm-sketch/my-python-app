<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA // 高级人工智能</title>
  <style>
    :root {
      --cyan: #00e5ff;
      --cyan-dim: #0a8aa0;
      --bg: #04070d;
      --panel: rgba(10, 20, 32, 0.72);
      --grid: rgba(0, 229, 255, 0.06);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "JetBrains Mono", "Consolas", "Courier New", monospace;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(0,229,255,0.10), transparent 60%),
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        var(--bg);
      color: #cfe9f2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%; max-width: 600px; height: 88vh;
      display: flex; flex-direction: column;
      background: var(--panel);
      border: 1px solid rgba(0,229,255,0.25);
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(0,229,255,0.12), inset 0 0 30px rgba(0,229,255,0.04);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(0,229,255,0.2);
      background: linear-gradient(180deg, rgba(0,229,255,0.08), transparent);
    }
    .logo {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      display: flex; align-items: center; justify-content: center;
      color: var(--cyan); font-weight: 700; font-size: 14px;
      animation: spin 8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { flex: 1; }
    .title b { color: var(--cyan); letter-spacing: 2px; font-size: 16px; }
    .title small { display: block; opacity: .6; font-size: 11px; letter-spacing: 1px; }
    .status { font-size: 11px; color: #4be39a; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4be39a; box-shadow: 0 0 8px #4be39a; animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: .25; } }

    #chat {
      flex: 1; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    .bubble {
      max-width: 84%; padding: 10px 14px; border-radius: 10px;
      line-height: 1.55; font-size: 14px; white-space: pre-wrap; word-break: break-word;
      border-left: 3px solid var(--cyan);
      background: rgba(0,229,255,0.06);
      box-shadow: 0 0 12px rgba(0,229,255,0.08);
    }
    .bubble.me {
      align-self: flex-end; border-left: none; border-right: 3px solid #6c7a89;
      background: rgba(108,122,137,0.12); box-shadow: none; color: #d7e6f0;
    }
    .bubble .who { display:block; font-size: 10px; opacity: .55; margin-bottom: 4px; letter-spacing: 1px; }

    .controls { display: flex; gap: 8px; padding: 14px; border-top: 1px solid rgba(0,229,255,0.2); align-items: center; }
    #micBtn {
      flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%;
      border: 1px solid var(--cyan); background: rgba(0,229,255,0.08); color: var(--cyan);
      cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;
      transition: .2s;
    }
    #micBtn:hover { box-shadow: 0 0 16px var(--cyan); }
    #micBtn.listening { background: var(--cyan); color: #04070d; animation: pulse 1.1s infinite; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(0,229,255,.6);} 50%{ box-shadow:0 0 0 10px rgba(0,229,255,0);} }
    #textInput {
      flex: 1; padding: 13px; border-radius: 8px; border: 1px solid rgba(0,229,255,0.25);
      background: rgba(0,0,0,0.35); color: #cfe9f2; font-family: inherit; font-size: 14px; outline: none;
    }
    #textInput:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,229,255,0.25); }
    #sendBtn {
      padding: 13px 18px; border: 1px solid var(--cyan); border-radius: 8px;
      background: var(--cyan); color: #04070d; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 14px;
    }
    #sendBtn:hover { box-shadow: 0 0 14px var(--cyan); }
    #status { text-align: center; font-size: 12px; min-height: 16px; color: var(--cyan); opacity: .85; padding-bottom: 6px; }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.3); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">N</div>
      <div class="title">
        <b>NOVA</b>
        <small>高级人工智能 · NEURAL OPERATIVE VISUAL ASSISTANT</small>
      </div>
      <div class="status"><span class="dot"></span> SYSTEM ONLINE</div>
    </header>
    <div id="chat"></div>
    <div class="controls">
      <button id="micBtn" title="语音输入">🎤</button>
      <input id="textInput" placeholder="向 NOVA 输入指令…" autocomplete="off" />
      <button id="sendBtn">发送</button>
    </div>
    <p id="status"></p>
  </div>

  <script>
    const chatEl = document.getElementById("chat");
    const micBtn = document.getElementById("micBtn");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");

    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      const label = document.createElement("span");
      label.className = "who";
      label.textContent = who === "me" ? "USER" : "NOVA";
      div.appendChild(label);
      div.appendChild(document.createTextNode(text));
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function ask(message) {
      addBubble(message, "me");
      statusEl.textContent = "> 分析中…";
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "请求失败");
        addBubble(data.reply, "ai");
        speak(data.reply);
        statusEl.textContent = "";
      } catch (e) {
        addBubble("错误：" + e.message, "ai");
        statusEl.textContent = "";
      }
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = 1.02;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognizer = null, listening = false;
    if (SR) {
      recognizer = new SR();
      recognizer.lang = "zh-CN";
      recognizer.interimResults = false;
      recognizer.onresult = (e) => ask(e.results[0][0].transcript);
      recognizer.onerror = (e) => {
        statusEl.textContent = "语音识别出错：" + e.error + "（需 HTTPS 才能用麦克风）";
        listening = false; micBtn.classList.remove("listening");
      };
      recognizer.onend = () => { if (listening) recognizer.start(); };
    } else {
      micBtn.disabled = true; micBtn.style.opacity = .4; micBtn.title = "浏览器不支持语音";
    }

    micBtn.addEventListener("click", () => {
      if (!recognizer) return;
      if (!listening) {
        recognizer.start(); listening = true; micBtn.classList.add("listening");
        statusEl.textContent = "> 聆听中…";
      } else {
        recognizer.stop(); listening = false; micBtn.classList.remove("listening");
        statusEl.textContent = "";
      }
    });

    sendBtn.addEventListener("click", () => {
      const v = textInput.value.trim();
      if (v) { ask(v); textInput.value = ""; }
    });
    textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendBtn.click(); });

    addBubble("系统初始化完成。我是 NOVA，高级人工智能。检测到用户已接入，请下达指令。", "ai");
  </script>
</body>
</html>
