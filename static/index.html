<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA // 高级人工智能</title>

  <!-- Markdown 渲染 + XSS 防护 + 代码高亮（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --cyan: #00e5ff;
      --cyan-dim: #0a8aa0;
      --purple: #b14eff;
      --orange: #ff9a3c;
      --green: #4be39a;
      --bg: #04070d;
      --bg2: #060c16;
      --panel: rgba(8, 16, 28, 0.55);
      --panel-solid: rgba(8, 16, 28, 0.94);
      --text: #cfe9f2;
      --text-dim: #7a96a8;
      --grid: rgba(0, 229, 255, 0.05);
      --border: rgba(0, 229, 255, 0.22);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "JetBrains Mono", "Consolas", "Courier New", monospace;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(0,229,255,0.12), transparent 60%),
        radial-gradient(800px 500px at 90% 110%, rgba(177,78,255,0.08), transparent 60%),
        linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 40px 40px,
        var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    /* ============ 玻璃拟态主面板 ============ */
    .container {
      position: relative;
      width: 100%; max-width: 640px; height: 90vh;
      display: flex; flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow:
        0 0 50px rgba(0,229,255,0.10),
        inset 0 0 40px rgba(0,229,255,0.03),
        0 20px 60px rgba(0,0,0,0.55);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      overflow: hidden;
    }

    /* ============ HUD 四角装饰 ============ */
    .hud-corner {
      position: absolute; width: 22px; height: 22px;
      border: 2px solid var(--cyan); pointer-events: none; z-index: 6;
      filter: drop-shadow(0 0 4px var(--cyan));
    }
    .hud-corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
    .hud-corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; border-top-right-radius: 6px; }
    .hud-corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; border-bottom-left-radius: 6px; }
    .hud-corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; border-bottom-right-radius: 6px; }

    /* ============ 顶部 HUD 头 ============ */
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(0,229,255,0.18);
      background: linear-gradient(180deg, rgba(0,229,255,0.08), transparent);
      position: relative; z-index: 3;
    }
    .logo {
      width: 38px; height: 38px; border-radius: 50%;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 16px var(--cyan), inset 0 0 8px rgba(0,229,255,0.4);
      display: flex; align-items: center; justify-content: center;
      color: var(--cyan); font-weight: 700; font-size: 15px;
      position: relative; flex: 0 0 auto;
    }
    .logo::before {
      content: ""; position: absolute; inset: -5px;
      border: 1px solid rgba(0,229,255,0.4); border-radius: 50%;
      border-top-color: transparent; border-left-color: transparent;
      animation: spin 6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { flex: 1; min-width: 0; }
    .title b { color: var(--cyan); letter-spacing: 3px; font-size: 17px; text-shadow: 0 0 10px rgba(0,229,255,0.5); }
    .title small { display: block; opacity: .55; font-size: 10px; letter-spacing: 1.5px; margin-top: 2px; }
    .status { font-size: 10px; color: var(--green); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 1.6s infinite; }
    @keyframes blink { 50% { opacity: .25; } }

    .icon-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(0,229,255,0.4); background: rgba(0,229,255,0.06);
      color: var(--cyan); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center; transition: .2s;
      flex: 0 0 auto;
    }
    .icon-btn:hover { box-shadow: 0 0 12px var(--cyan); background: rgba(0,229,255,0.14); }
    .icon-btn.off { opacity: .45; border-color: #6c7a89; color: #6c7a89; }
    .icon-btn.danger { border-color: rgba(255,154,60,0.5); color: var(--orange); }
    .icon-btn.danger:hover { box-shadow: 0 0 12px var(--orange); background: rgba(255,154,60,0.12); }

    /* ============ 聊天区 + 扫描线 ============ */
    #chat {
      flex: 1; padding: 18px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 14px;
      position: relative;
    }
    .scanline {
      position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan) 50%, transparent);
      box-shadow: 0 0 10px var(--cyan);
      opacity: 0; pointer-events: none; z-index: 2;
      animation: scan 5s linear infinite;
    }
    @keyframes scan {
      0%   { top: 0%; opacity: 0; }
      8%   { opacity: 0.55; }
      92%  { opacity: 0.55; }
      100% { top: 100%; opacity: 0; }
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.3); border-radius: 3px; }
    #chat::-webkit-scrollbar-thumb:hover { background: rgba(0,229,255,0.5); }

    /* ============ 消息气泡（玻璃拟态 + 滑入动画） ============ */
    .bubble {
      max-width: 86%; padding: 11px 15px; border-radius: 12px;
      line-height: 1.6; font-size: 14px; word-break: break-word;
      border-left: 3px solid var(--cyan);
      background: rgba(0,229,255,0.06);
      box-shadow: 0 0 14px rgba(0,229,255,0.08), inset 0 0 12px rgba(0,229,255,0.03);
      backdrop-filter: blur(6px);
      animation: slideUp 0.42s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble.me {
      align-self: flex-end; border-left: none; border-right: 3px solid var(--purple);
      background: rgba(177,78,255,0.10); box-shadow: 0 0 12px rgba(177,78,255,0.10); color: #e3d7f5;
    }
    .bubble .who { display: block; font-size: 10px; opacity: .6; margin-bottom: 5px; letter-spacing: 1.5px; }
    .bubble.me .who { color: var(--purple); }
    .bubble.ai .who { color: var(--cyan); }

    /* ============ 流式光标 ============ */
    .stream-cursor {
      display: inline-block; width: 8px; height: 15px; vertical-align: text-bottom;
      background: var(--cyan); margin-left: 2px; border-radius: 1px;
      box-shadow: 0 0 8px var(--cyan);
      animation: blinkCursor 0.9s steps(2) infinite;
    }
    @keyframes blinkCursor { 50% { opacity: 0; } }

    /* ============ AI 思考态（旋转加载） ============ */
    .bubble.thinking .content { display: flex; align-items: center; gap: 10px; }
    .think-spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(0,229,255,0.2); border-top-color: var(--cyan);
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 8px rgba(0,229,255,0.4);
    }
    .think-text { color: var(--cyan); letter-spacing: 1px; }
    .think-dots::after {
      content: ""; animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%, 100% { content: "..."; }
    }

    /* ============ 输入控制栏 ============ */
    .controls {
      display: flex; gap: 10px; padding: 14px 16px;
      border-top: 1px solid rgba(0,229,255,0.18);
      align-items: center; position: relative; z-index: 3;
      background: linear-gradient(0deg, rgba(0,229,255,0.05), transparent);
    }
    #micBtn {
      flex: 0 0 auto; width: 50px; height: 50px; border-radius: 50%;
      border: 1px solid var(--cyan); background: rgba(0,229,255,0.08); color: var(--cyan);
      cursor: pointer; font-size: 19px; display: flex; align-items: center; justify-content: center;
      transition: .2s;
    }
    #micBtn:hover { box-shadow: 0 0 16px var(--cyan); }
    #micBtn.listening { background: var(--cyan); color: #04070d; animation: pulse 1.1s infinite; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(0,229,255,.6);} 50%{ box-shadow:0 0 0 12px rgba(0,229,255,0);} }
    #textInput {
      flex: 1; padding: 13px 15px; border-radius: 10px; border: 1px solid rgba(0,229,255,0.25);
      background: rgba(0,0,0,0.4); color: var(--text); font-family: inherit; font-size: 14px; outline: none;
      transition: .2s;
    }
    #textInput:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,0.3); }
    #sendBtn {
      padding: 13px 20px; border: 1px solid var(--cyan); border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-dim));
      color: #04070d; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 14px;
      transition: .2s; letter-spacing: 1px;
    }
    #sendBtn:hover { box-shadow: 0 0 16px var(--cyan); transform: translateY(-1px); }
    #sendBtn:active { transform: translateY(0); }
    #status { text-align: center; font-size: 11px; min-height: 16px; color: var(--cyan); opacity: .85; padding: 0 0 8px; letter-spacing: 1px; }

    /* ============ 声音选择器 ============ */
    .voice-picker { position: relative; }
    .voice-menu {
      display: none; position: absolute; right: 0; top: 40px;
      background: var(--panel-solid); border: 1px solid var(--cyan); border-radius: 8px;
      min-width: 220px; max-height: 280px; overflow-y: auto; z-index: 100;
      box-shadow: 0 0 20px rgba(0,229,255,0.3); backdrop-filter: blur(12px);
    }
    .voice-menu.open { display: block; }
    .voice-item {
      display: block; width: 100%; padding: 10px 14px; background: none;
      border: none; border-bottom: 1px solid rgba(0,229,255,0.1);
      color: var(--cyan); text-align: left; cursor: pointer; font-size: 13px;
      font-family: monospace; transition: background 0.15s;
    }
    .voice-item:last-child { border-bottom: none; }
    .voice-item:hover { background: rgba(0,229,255,0.15); }
    .voice-item.active { background: rgba(0,229,255,0.22); font-weight: bold; }
    .voice-item.active::before { content: "✓ "; }

    /* ============ Markdown 内容样式 ============ */
    .content > :last-child { margin-bottom: 0; }
    .content p { margin: 0 0 8px; }
    .content ul, .content ol { margin: 6px 0 8px; padding-left: 22px; }
    .content li { margin: 3px 0; }
    .content code {
      background: rgba(0,229,255,0.13); color: var(--cyan);
      padding: 1px 6px; border-radius: 4px; font-size: 0.9em;
      font-family: "JetBrains Mono", monospace;
    }
    .content pre {
      background: rgba(2,6,12,0.75); border: 1px solid rgba(0,229,255,0.25);
      border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 8px 0;
      box-shadow: inset 0 0 12px rgba(0,229,255,0.05);
    }
    .content pre code { background: none; color: #d6f0fa; padding: 0; font-size: 13px; }
    .content table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 13px; display: block; overflow-x: auto; }
    .content th, .content td { border: 1px solid rgba(0,229,255,0.3); padding: 6px 10px; text-align: left; }
    .content th { background: rgba(0,229,255,0.15); color: var(--cyan); letter-spacing: 1px; }
    .content tr:nth-child(even) td { background: rgba(0,229,255,0.04); }
    .content blockquote { border-left: 3px solid var(--purple); margin: 8px 0; padding: 2px 12px; color: var(--text-dim); background: rgba(177,78,255,0.06); border-radius: 0 6px 6px 0; }
    .content a { color: var(--orange); text-decoration: none; border-bottom: 1px dashed var(--orange); }
    .content h1, .content h2, .content h3 { color: var(--cyan); margin: 12px 0 6px; letter-spacing: 1px; }
    .content hr { border: none; border-top: 1px solid rgba(0,229,255,0.2); margin: 10px 0; }
    .content strong { color: #fff; }

    /* 响应式：小屏适配 */
    @media (max-width: 520px) {
      body { padding: 0; }
      .container { height: 100vh; border-radius: 0; max-width: 100%; }
      .title small { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HUD 四角装饰 -->
    <div class="hud-corner tl"></div>
    <div class="hud-corner tr"></div>
    <div class="hud-corner bl"></div>
    <div class="hud-corner br"></div>

    <header>
      <div class="logo">N</div>
      <div class="title">
        <b>NOVA</b>
        <small>NEURAL OPERATIVE VISUAL ASSISTANT</small>
      </div>
      <div class="status"><span class="dot"></span> ONLINE</div>
      <button id="voiceBtn" class="icon-btn" title="语音播报开关">🔊</button>
      <div class="voice-picker">
        <button id="voicePickerBtn" class="icon-btn" title="选择中文声音">🎙️</button>
        <div id="voiceMenu" class="voice-menu"></div>
      </div>
      <button id="clearBtn" class="icon-btn danger" title="清空对话历史">🗑</button>
    </header>

    <div id="chat">
      <div class="scanline"></div>
    </div>

    <div class="controls">
      <button id="micBtn" title="语音输入">🎤</button>
      <input id="textInput" placeholder="向 NOVA 输入指令…" autocomplete="off" />
      <button id="sendBtn">发送</button>
    </div>
    <p id="status"></p>
  </div>

  <script>
    // ============ Markdown 配置 ============
    marked.setOptions({ gfm: true, breaks: true });

    const chatEl = document.getElementById("chat");
    const micBtn = document.getElementById("micBtn");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusEl = document.getElementById("status");
    const clearBtn = document.getElementById("clearBtn");

    // ============ 对话历史 localStorage 持久化 ============
    const HISTORY_KEY = "nova_chat_history";
    let history = [];

    function loadHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        history = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(history)) history = [];
      } catch (e) { history = []; }
    }
    function saveHistory() {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
    }

    // 把文本渲染成安全的 Markdown HTML，并高亮代码
    function renderMarkdown(text) {
      const raw = marked.parse(text || "");
      const clean = DOMPurify.sanitize(raw);
      const tmp = document.createElement("div");
      tmp.innerHTML = clean;
      tmp.querySelectorAll("pre code").forEach(el => {
        try { hljs.highlightElement(el); } catch (e) {}
      });
      return tmp.innerHTML;
    }

    // ============ 气泡创建 ============
    function addBubble(text, who, save = true) {
      const div = document.createElement("div");
      div.className = "bubble " + who;
      const label = document.createElement("span");
      label.className = "who";
      label.textContent = who === "me" ? "USER" : "NOVA";
      const content = document.createElement("div");
      content.className = "content";
      if (who === "ai") {
        content.innerHTML = renderMarkdown(text);
      } else {
        content.textContent = text;  // 用户输入转义，防 XSS
      }
      div.appendChild(label);
      div.appendChild(content);
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      if (save) {
        history.push({ role: who, text, time: Date.now() });
        saveHistory();
      }
      return div;
    }

    function createAiBubble() {
      const div = document.createElement("div");
      div.className = "bubble ai streaming";
      const label = document.createElement("span");
      label.className = "who";
      label.textContent = "NOVA";
      const content = document.createElement("div");
      content.className = "content";
      div.appendChild(label);
      div.appendChild(content);
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    // ============ AI 思考态 ============
    function showThinking() {
      const div = document.createElement("div");
      div.className = "bubble ai thinking";
      div.id = "thinkingBubble";
      div.innerHTML = '<span class="who">NOVA</span><div class="content">'
        + '<span class="think-spinner"></span>'
        + '<span class="think-text">分析中<span class="think-dots"></span></span>'
        + '</div>';
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function hideThinking() {
      const t = document.getElementById("thinkingBubble");
      if (t) t.remove();
    }

    // ============ 流式渲染（fetch + ReadableStream 逐字显示） ============
    function renderStreaming(bubble, text) {
      const content = bubble.querySelector(".content");
      content.innerHTML = renderMarkdown(text) + '<span class="stream-cursor"></span>';
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function finalizeBubble(bubble, text) {
      const content = bubble.querySelector(".content");
      content.innerHTML = renderMarkdown(text);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    let streaming = false;  // 防止并发发送

    async function ask(message) {
      if (streaming) return;
      streaming = true;
      sendBtn.disabled = true;
      addBubble(message, "me");
      showThinking();

      let aiBubble = null;
      let aiText = "";

      try {
        const res = await fetch("/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || "请求失败 (" + res.status + ")");
        }

        hideThinking();
        aiBubble = createAiBubble();

        // 用 ReadableStream 逐块读取 SSE 流
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // SSE 事件以 \n\n 分隔，逐个解析
          let idx;
          while ((idx = buffer.indexOf("\n\n")) >= 0) {
            const eventStr = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            const line = eventStr.trim();
            if (!line.startsWith("data:")) continue;
            const payload = line.slice(line.indexOf(":") + 1).trim();
            if (payload === "[DONE]") {
              continue;  // 流结束
            }
            try {
              const obj = JSON.parse(payload);
              if (obj.delta) {
                aiText += obj.delta;
                renderStreaming(aiBubble, aiText);
              } else if (obj.error) {
                throw new Error(obj.error);
              }
            } catch (e) {
              if (e.message && !e.message.includes("JSON")) throw e;
            }
          }
        }

        // 流结束：定稿渲染 + 语音 + 持久化
        if (aiText) {
          finalizeBubble(aiBubble, aiText);
          history.push({ role: "ai", text: aiText, time: Date.now() });
          saveHistory();
          speak(aiText);
        } else {
          aiBubble.remove();
          addBubble("（NOVA 未返回内容）", "ai");
        }
        statusEl.textContent = "";
      } catch (e) {
        hideThinking();
        if (aiBubble) aiBubble.remove();
        addBubble("错误：" + e.message, "ai");
        statusEl.textContent = "";
      } finally {
        streaming = false;
        sendBtn.disabled = false;
      }
    }

    // ============ 语音输出（保留原逻辑：TTS 优先，降级本地） ============
    let voiceOn = true;
    let zhVoice = null;
    const VOICE_KEY = "nova_voice_uri";

    function refreshVoices() {
      if (!("speechSynthesis" in window)) return;
      const vs = speechSynthesis.getVoices();
      const zh = vs.filter(v => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("zh"));
      const saved = localStorage.getItem(VOICE_KEY);
      zhVoice = null;
      if (saved) {
        const hit = zh.find(v => v.voiceURI === saved);
        if (hit) zhVoice = hit;
      }
      if (!zhVoice) {
        const prefer = ["Xiaoxiao", "Yunxi", "Xiaoyi", "Yunjian", "Xiaohan", "Xiaomo",
                        "Xiaoxuan", "Xiaomeng", "Xiaorui", "Natural", "Online",
                        "Huihui", "Yaoyao", "Kangkang", "Tingting", "Sinji", "Meijia", "Lili"];
        for (const key of prefer) {
          const hit = zh.find(v => v.name.includes(key));
          if (hit) { zhVoice = hit; break; }
        }
      }
      if (!zhVoice) zhVoice = zh[0] || null;
      buildVoiceMenu(zh);
    }

    function buildVoiceMenu(zh) {
      const menu = document.getElementById("voiceMenu");
      if (!menu) return;
      menu.innerHTML = "";
      zh.forEach(v => {
        const btn = document.createElement("button");
        btn.className = "voice-item" + (zhVoice && v.voiceURI === zhVoice.voiceURI ? " active" : "");
        btn.textContent = v.name;
        btn.addEventListener("click", () => {
          zhVoice = v;
          localStorage.setItem(VOICE_KEY, v.voiceURI);
          refreshVoices();
          const u = new SpeechSynthesisUtterance("你好，我是NOVA，这是新的声音。");
          u.lang = "zh-CN"; u.voice = v; u.rate = 1.02; u.pitch = 0.95;
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
        });
        menu.appendChild(btn);
      });
    }

    if ("speechSynthesis" in window) {
      refreshVoices();
      speechSynthesis.onvoiceschanged = refreshVoices;
    }

    let currentAudio = null;
    async function speak(text) {
      if (!voiceOn) return;
      try {
        const res = await fetch("/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (res.ok) {
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          if (currentAudio) { currentAudio.pause(); URL.revokeObjectURL(currentAudio.src); }
          currentAudio = new Audio(url);
          currentAudio.play().catch(() => {});
          return;
        }
      } catch (e) {}
      if (!("speechSynthesis" in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      if (zhVoice) u.voice = zhVoice;
      u.rate = 1.02; u.pitch = 0.95;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }

    const voiceBtn = document.getElementById("voiceBtn");
    voiceBtn.addEventListener("click", () => {
      voiceOn = !voiceOn;
      voiceBtn.textContent = voiceOn ? "🔊" : "🔇";
      voiceBtn.classList.toggle("off", !voiceOn);
      if (!voiceOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
    });

    const voicePickerBtn = document.getElementById("voicePickerBtn");
    const voiceMenu = document.getElementById("voiceMenu");
    if (voicePickerBtn && voiceMenu) {
      voicePickerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        voiceMenu.classList.toggle("open");
      });
      document.addEventListener("click", (e) => {
        if (!voiceMenu.contains(e.target) && e.target !== voicePickerBtn) {
          voiceMenu.classList.remove("open");
        }
      });
    }

    // ============ 语音输入（腾讯云 ASR：录音 → 上传识别）
    // Chrome 的 webkitSpeechRecognition 强依赖 Google 服务，中国大陆不可用，
    // 改用：getUserMedia + AudioContext 采 16kHz PCM → 封装 WAV → POST /asr（腾讯云一句话识别）
    let audioStream = null, audioCtx = null, processor = null, sourceNode = null, gainNode = null;
    let pcmChunks = [];
    let actualSampleRate = 16000;   // 浏览器真实采样率（startRecording 时获取）
    let isRecording = false;
    let asrBusy = false;

    // 把 Int16 PCM 封装成 WAV（16kHz 单声道）
    function encodeWAV(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);              // PCM
      view.setUint16(22, 1, true);              // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); // byte rate
      view.setUint16(32, 2, true);              // block align
      view.setUint16(34, 16, true);             // bits per sample
      writeStr(36, "data");
      view.setUint32(40, samples.length * 2, true);
      for (let i = 0; i < samples.length; i++) view.setInt16(44 + i * 2, samples[i], true);
      return new Blob([view], { type: "audio/wav" });
    }

    // 把 Float32 采样从 fromRate 重采样到 toRate（线性平均），输出 Int16。
    // 解决：浏览器强制硬件采样率（48000），WAV 头标 16000 导致腾讯云解析慢放乱码的问题。
    function downsampleBuffer(buffer, fromRate, toRate) {
      if (fromRate === toRate) {
        const out = new Int16Array(buffer.length);
        for (let i = 0; i < buffer.length; i++) out[i] = Math.max(-1, Math.min(1, buffer[i])) * 0x7fff;
        return out;
      }
      const ratio = fromRate / toRate;
      const newLength = Math.round(buffer.length / ratio);
      const result = new Int16Array(newLength);
      let offsetResult = 0, offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0, count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
          accum += buffer[i]; count++;
        }
        result[offsetResult] = Math.max(-1, Math.min(1, accum / count)) * 0x7fff;
        offsetResult++;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    async function startRecording() {
      try {
        // 第 1 步：先获取麦克风权限（不带 deviceId，让 Chrome 用默认）
        // 这样才能在 enumerateDevices 里拿到真实的 label
        const firstStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const defaultDeviceId = firstStream.getAudioTracks()[0].getSettings().deviceId;
        firstStream.getTracks().forEach(t => t.stop());  // 立刻释放，会重新选择设备

        // 第 2 步：枚举设备（此时 label 不再为空）
        let realDeviceId = null;
        try {
          const devs = await navigator.mediaDevices.enumerateDevices();
          const mics = devs.filter(d => d.kind === "audioinput");
          // 排除 SteelSeries Sonar / Virtual / Stereo Mix 等虚拟/无声设备
          // ⚠️ 不能用 /mic/ — "Microphone" 含 "mic" 会让 SteelSeries Sonar 误匹配
          // 用更精确的关键字：realtek / microphone array / internal
          const realMic = mics.find(d => /realtek|microphone array|internal/i.test(d.label))
                         || mics.find(d => !/sonar|virtual|stereo mix|communications|waveterm/i.test(d.label))
                         || null;
          realDeviceId = realMic ? realMic.deviceId : (defaultDeviceId || null);
          const label = realMic ? realMic.label : "默认";
          console.log("NOVA ASR: 使用麦克风:", label, realDeviceId ? `(id=${realDeviceId.slice(0,8)}...)` : "");
        } catch (e) {
          console.warn("NOVA ASR: 枚举设备失败，用默认", e);
          realDeviceId = defaultDeviceId || null;
        }

        // 第 3 步：用选中的真实麦克风重新打开流（关掉 EC/NS/AGC，它们会把声音压成静音）
        audioStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            ...(realDeviceId ? { deviceId: { exact: realDeviceId } } : {}),
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
          }
        });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();  // 不强制采样率，用浏览器真实值
        sourceNode = audioCtx.createMediaStreamSource(audioStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);
        pcmChunks = [];
        actualSampleRate = audioCtx.sampleRate;  // 记录真实采样率（通常 48000/44100）
        processor.onaudioprocess = (e) => {
          const data = e.inputBuffer.getChannelData(0);
          pcmChunks.push(new Float32Array(data));  // 存原始 Float32，停止时统一降采样
          // 实时音量反馈：让用户知道麦克风是否在采集（Chrome 静音优化会导致数据全 0）
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
          const rms = Math.sqrt(sum / data.length);
          if (micBtn) {
            const lvl = Math.min(8, Math.max(0, Math.floor(rms * 80)));
            micBtn.style.boxShadow = `0 0 ${4 + lvl * 3}px rgba(0,229,255,${0.3 + rms * 4})`;
            micBtn.style.transform = rms > 0.005 ? `scale(${1 + Math.min(0.15, rms * 4)})` : '';
          }
        };
        sourceNode.connect(processor);
        // ⚠️ 不能用 gain=0！Chrome 会把"无声音输出"的音频图静音化，导致 onaudioprocess 收不到数据。
        // 必须非零（极小即可）保持音频图活跃，processor 才能持续收到麦克风数据。
        // gainNode 只为"防止自己听到回声"，不是用来阻止 onaudioprocess 触发。
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 0.0001;   // 极小但非零，避开 Chrome 静音优化
        processor.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        isRecording = true;
      } catch (e) {
        statusEl.textContent = "麦克风不可用：" + (e.name === "NotAllowedError" ? "请在地址栏允许麦克风权限" : e.message);
        micBtn.classList.remove("listening");
      }
    }

    function stopRecording() {
      isRecording = false;
      try {
        processor.disconnect(); sourceNode.disconnect();
        if (gainNode) gainNode.disconnect();
        audioCtx.close();
        audioStream.getTracks().forEach(t => t.stop());
      } catch (e) { /* 忽略清理错误 */ }

      // 合并 Float32 采样
      const total = pcmChunks.reduce((n, c) => n + c.length, 0);
      const merged = new Float32Array(total);
      let off = 0;
      for (const c of pcmChunks) { merged.set(c, off); off += c.length; }
      // 按浏览器真实采样率降采样到 16000（腾讯云 16k_zh 要求）
      const pcm16 = downsampleBuffer(merged, actualSampleRate, 16000);
      if (pcm16.length < 2400) { statusEl.textContent = "没听到声音，请重试"; return; }  // <0.15s 视为无效

      const wav = encodeWAV(pcm16, 16000);
      uploadASR(wav);
    }

    async function uploadASR(wavBlob) {
      asrBusy = true;
      micBtn.disabled = true;
      statusEl.textContent = "> 识别中…";
      // 客户端超时：后端腾讯云超时 10s，这里给 25s 余量；超时即视为后端/代理无响应
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 25000);
      try {
        const form = new FormData();
        form.append("audio", wavBlob, "voice.wav");
        const res = await fetch("/asr", { method: "POST", body: form, signal: controller.signal });
        clearTimeout(timer);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          // 后端返回了 HTTP 错误（含腾讯云真实 detail），原样展示
          const detail = data.detail ? "（" + data.detail + "）" : "";
          throw new Error((data.error || ("HTTP " + res.status)) + detail);
        }
        const text = (data.text || "").trim();
        if (text) { textInput.value = ""; ask(text); }
        else statusEl.textContent = "没听清，请再说一遍";
      } catch (e) {
        clearTimeout(timer);
        if (e.name === "AbortError") {
          statusEl.textContent = "识别超时（>25s）：后端未响应，可能 Nginx 代理超时或服务器到腾讯云网络不通";
        } else if (/Failed to fetch|NetworkError|network/i.test(e.message || "")) {
          // fetch 原生网络错误：请求根本没到服务器（典型：Nginx 未代理 /asr）
          statusEl.textContent = "网络错误：请求未送达服务器。可能 Nginx 未代理 /asr，或服务器不可达";
        } else {
          statusEl.textContent = "识别出错：" + e.message;
        }
      } finally {
        clearTimeout(timer);
        asrBusy = false;
        micBtn.disabled = false;
      }
    }

    micBtn.addEventListener("click", () => {
      if (asrBusy || streaming) return;
      if (!isRecording) {
        micBtn.classList.add("listening");
        statusEl.textContent = "> 聆听中…（说完再点一次停止）";
        startRecording();
        // 5 秒后自动停止（避免用户忘了点第二次）
        autoStopTimer = setTimeout(() => {
          if (isRecording) {
            micBtn.classList.remove("listening");
            stopRecording();
          }
        }, 5000);
      } else {
        clearTimeout(autoStopTimer);
        micBtn.classList.remove("listening");
        stopRecording();
      }
    });
    let autoStopTimer = null;

    // ============ 发送 & 清空 ============
    sendBtn.addEventListener("click", () => {
      const v = textInput.value.trim();
      if (v && !streaming) { ask(v); textInput.value = ""; }
    });
    textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendBtn.click(); });

    clearBtn.addEventListener("click", () => {
      if (!confirm("清空所有对话历史？此操作不可撤销。")) return;
      history = [];
      saveHistory();
      chatEl.innerHTML = '<div class="scanline"></div>';
      addBubble("对话记录已清除。系统就绪，请下达新指令。", "ai");
    });

    // ============ 启动：加载历史或欢迎语 ============
    loadHistory();
    if (history.length === 0) {
      addBubble("系统初始化完成。我是 NOVA，高级人工智能。检测到用户已接入，请下达指令。", "ai");
    } else {
      history.forEach(m => {
        const div = document.createElement("div");
        div.className = "bubble " + m.role;
        const label = document.createElement("span");
        label.className = "who";
        label.textContent = m.role === "me" ? "USER" : "NOVA";
        const content = document.createElement("div");
        content.className = "content";
        if (m.role === "ai") content.innerHTML = renderMarkdown(m.text);
        else content.textContent = m.text;
        div.appendChild(label);
        div.appendChild(content);
        chatEl.appendChild(div);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    }
  </script>
</body>
</html>
